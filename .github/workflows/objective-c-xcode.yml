name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: SwiftLint & swift-format
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: |
          cd "$GITHUB_WORKSPACE"
          swiftlint lint --quiet
      - name: Run swift-format lint
        run: |
          cd "$GITHUB_WORKSPACE"
          xcrun swift-format lint \
            --configuration .swift-format \
            --recursive bilibili_tv bilibili_tvTests bilibili_tvUITests \
            > /tmp/swiftformat-lint.log 2>&1
          format_status=$?
          issues=$(grep -vE '\.pb\.swift|Vendor/|bilibili_tvApp|bilibili_tvTests\.swift|ep_id|DanmakuTrack|NoBlockComments' /tmp/swiftformat-lint.log | grep -E 'warning|error' || true)
          if [ $format_status -ne 0 ] || [ -n "$issues" ]; then
            echo "$issues"
            echo "::error::swift-format found formatting issues"
            exit 1
          fi

  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Install xcresultparser
        run: brew install xcresultparser
      - name: Cache Swift PM & DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/*.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Build for testing
        env:
          scheme: ${{ 'default' }}
        run: |
          set -o pipefail
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "platform=tvOS Simulator,name=Apple TV" \
            -enableCodeCoverage YES 2>&1 | xcbeautify
      - name: Run Tests
        env:
          scheme: ${{ 'default' }}
        run: |
          set -o pipefail
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "platform=tvOS Simulator,name=Apple TV" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult 2>&1 | xcbeautify
      - name: Export coverage
        run: |
          xcresultparser \
            --output-format cobertura \
            --project-root "$GITHUB_WORKSPACE" \
            TestResults.xcresult > coverage.xml
          echo "Exported coverage.xml ($(wc -l < coverage.xml) lines)"
      - name: Print coverage summary
        run: |
          line_rate=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | cut -d'"' -f2)
          lines_covered=$(grep -o 'lines-covered="[0-9]*"' coverage.xml | head -1 | cut -d'"' -f2)
          lines_valid=$(grep -o 'lines-valid="[0-9]*"' coverage.xml | head -1 | cut -d'"' -f2)
          printf "Line coverage: %.2f%% (%s/%s lines)\n" "$(echo "$line_rate * 100" | bc -l)" "$lines_covered" "$lines_valid"
      # - name: Upload coverage report
      #   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
