name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: SwiftLint & swift-format
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run lint & format check
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/check-lint-format.sh

  unit-tests:
    name: Unit + snapshot tests (bilibili_tvTests)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install xcresultparser
        run: brew install xcresultparser
      - name: Cache Swift PM & DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/*.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      # No xcbeautify in the pipe: measured on GH runners it buffers ALL output
      # until process exit (0 bytes mid-run), leaving the live job log empty for
      # the whole build+test. Raw streaming output is greppable and live.
      - name: Run unit + snapshot tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project bilibili_tv.xcodeproj \
            -scheme bilibili_tv \
            -destination "platform=tvOS Simulator,name=Apple TV 4K (3rd generation)" \
            -only-testing:bilibili_tvTests \
            -enableCodeCoverage YES \
            -resultBundlePath UnitResults.xcresult 2>&1 | tee raw-unit.log
      # Compact markdown (counts / failed tests / slowest tests) into the run
      # summary AND the job log; `::error` annotations on stderr surface failures
      # on the PR checks UI. Agents & humans get everything without downloading
      # the .xcresult artifact.
      - name: Test report & failure annotations
        if: always()
        run: |
          bash scripts/test-failure-report.sh UnitResults.xcresult "Unit + snapshot tests" > test-report.md
          cat test-report.md
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            UnitResults.xcresult
            raw-unit.log
          retention-days: 7
          if-no-files-found: warn
      - name: Export coverage
        if: success()
        run: |
          xcresultparser \
            --output-format cobertura \
            --project-root "$GITHUB_WORKSPACE" \
            UnitResults.xcresult > coverage.xml
          echo "Exported coverage.xml ($(wc -l < coverage.xml) lines)"
      - name: Print coverage summary
        if: success()
        run: |
          line_rate=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | cut -d'"' -f2)
          lines_covered=$(grep -o 'lines-covered="[0-9]*"' coverage.xml | head -1 | cut -d'"' -f2)
          lines_valid=$(grep -o 'lines-valid="[0-9]*"' coverage.xml | head -1 | cut -d'"' -f2)
          printf "Line coverage: %.2f%% (%s/%s lines)\n" "$(echo "$line_rate * 100" | bc -l)" "$lines_covered" "$lines_valid"

  ui-tests:
    # Serial by design (AGENTS.md §12): the scheme's parallelizable flag clones
    # simulators and makes focus-timing tests slower AND flakier.
    # If PR-time runtime becomes a problem, move this job to a nightly `schedule`
    # trigger once issue #51 (launch merging etc.) lands.
    name: UI tests (bilibili_tvUITests, serial)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cache Swift PM & DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/*.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      # Phase split (boot init → build → wait-for-boot → test). Boot is
      # initiated NON-BLOCKING before the build: `simctl boot` returns as soon
      # as CoreSimulator accepts the request and the boot itself proceeds
      # asynchronously in the CoreSimulator service, so it overlaps the CPU-
      # bound build instead of serializing after it (both phases ~1m20s each,
      # saving ~1m of job wall). The boot is only reaped after the build with
      # `bootstatus -b` (fast no-op when boot already finished mid-build), and
      # the booted simulator is reused by UDID so the boot phase is not
      # double-counted inside xcodebuild. No xcbeautify in the pipe (see
      # unit-tests job note).
      - name: Boot tvOS simulator (non-blocking)
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep "Apple TV 4K (3rd generation)" | grep -v "1080p" \
            | grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}' | head -1)
          echo "Booting Apple TV 4K (3rd generation): $UDID"
          echo "UI_BOOT_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "UI_SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build for testing
        run: |
          start=$(date +%s); rc=0
          xcodebuild build-for-testing \
            -project bilibili_tv.xcodeproj \
            -scheme bilibili_tv \
            -destination "platform=tvOS Simulator,name=Apple TV 4K (3rd generation)" \
            2>&1 | tee raw-ui-build.log || rc=$?
          echo "UI_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit $rc
      - name: Wait for simulator ready
        run: |
          # Reap the async boot: near-instant when boot finished during the
          # build; UI_BOOT_SECONDS is only the residual wait (adds to wall),
          # UI_BOOT_WALL_SECONDS is the boot's own wall (hidden under build).
          start=$(date +%s)
          xcrun simctl bootstatus "$UI_SIM_UDID" -b
          echo "UI_BOOT_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "UI_BOOT_WALL_SECONDS=$(( $(date +%s) - UI_BOOT_START_EPOCH ))" >> "$GITHUB_ENV"
      - name: Run UI tests
        run: |
          set -o pipefail
          start=$(date +%s); rc=0
          # Wall-clock bookmarks for the install-window query in the report
          # step (log show --start/--end use host-local time; CI hosts are UTC)
          echo "UI_RUN_START_TS=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          xcodebuild test-without-building \
            -project bilibili_tv.xcodeproj \
            -scheme bilibili_tv \
            -destination "id=$UI_SIM_UDID" \
            -only-testing:bilibili_tvUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath UIResults.xcresult 2>&1 | tee raw-ui.log || rc=$?
          echo "UI_RUN_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "UI_RUN_END_TS=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          exit $rc
      - name: Test report & failure annotations
        if: always()
        run: |
          bash scripts/test-failure-report.sh UIResults.xcresult "UI tests" > test-report.md
          cat test-report.md
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"

          # Phase duration table (steps record into GITHUB_ENV; default to 0
          # when a phase was never reached, e.g. build failed before boot).
          # Boot overlaps the build, so the Total row (build + boot-wait +
          # test) stays the true job wall; the boot's own wall is shown as an
          # informational sub-row.
          UI_BUILD_SECONDS=${UI_BUILD_SECONDS:-0}
          UI_BOOT_SECONDS=${UI_BOOT_SECONDS:-0}
          UI_BOOT_WALL_SECONDS=${UI_BOOT_WALL_SECONDS:-0}
          UI_RUN_SECONDS=${UI_RUN_SECONDS:-0}
          fmt() { printf '%dm %02ds' $(($1 / 60)) $(($1 % 60)); }
          opt() { if [ -n "$1" ]; then fmt "$1"; else echo "n/a"; fi; }
          to_epoch() { date -j -f "%Y-%m-%d %H:%M:%S" "$1" +%s 2>/dev/null || echo 0; }

          # App-install window inside the test phase: xcodebuild's console
          # output never marks "Installing", so query the simulator unified
          # log instead — first installcoordination event naming our bundle
          # through the last `setComplete:`. The sim installs nothing else in
          # this window (booted in the previous step), and both the log
          # timestamps and --start/--end are host-local (UTC on CI runners).
          UI_INSTALL_SECONDS=""
          if [ -n "${UI_SIM_UDID:-}" ] && [ -n "${UI_RUN_START_TS:-}" ] && [ -n "${UI_RUN_END_TS:-}" ]; then
            install_log=$(xcrun simctl spawn "$UI_SIM_UDID" log show \
              --style compact --start "$UI_RUN_START_TS" --end "$UI_RUN_END_TS" \
              --predicate 'subsystem == "com.apple.installcoordination"' 2>/dev/null || true)
            i_first=$(echo "$install_log" | grep -m1 "bilibili" | cut -c1-19)
            i_last=$(echo "$install_log" | grep "setComplete:" | tail -1 | cut -c1-19)
            if [ -n "$i_first" ] && [ -n "$i_last" ]; then
              UI_INSTALL_SECONDS=$(( $(to_epoch "$i_last") - $(to_epoch "$i_first") ))
            fi
          fi

          # Test-session window straight from the log's own timestamps
          # (`Test Suite 'All tests' started/passed at ...`); the remainder of
          # the test phase is launch + teardown overhead.
          UI_SESSION_SECONDS=""
          s0=$(grep -m1 "Test Suite 'All tests' started at" raw-ui.log | sed -E 's/.*started at ([0-9-]+ [0-9:]+)\..*/\1/')
          s1=$(grep -E "Test Suite 'All tests' (passed|failed) at" raw-ui.log | tail -1 | sed -E 's/.*at ([0-9-]+ [0-9:]+)\..*/\1/')
          if [ -n "$s0" ] && [ -n "$s1" ]; then
            UI_SESSION_SECONDS=$(( $(to_epoch "$s1") - $(to_epoch "$s0") ))
          fi

          total=$((UI_BUILD_SECONDS + UI_BOOT_SECONDS + UI_RUN_SECONDS))
          {
            echo ""
            echo "### Phase durations"
            echo ""
            echo "| Phase | Duration |"
            echo "|---|---:|"
            echo "| Build for testing | $(fmt "$UI_BUILD_SECONDS") |"
            echo "| Simulator boot (overlaps build) | $(fmt "$UI_BOOT_WALL_SECONDS") |"
            echo "| ↳ boot wait reaped after build | $(fmt "$UI_BOOT_SECONDS") |"
            echo "| Test execution | $(fmt "$UI_RUN_SECONDS") |"
            echo "| ↳ app install (sim log) | $(opt "$UI_INSTALL_SECONDS") |"
            echo "| ↳ test session (first→last suite) | $(opt "$UI_SESSION_SECONDS") |"
            echo "| **Total (wall: build + boot-wait + test)** | **$(fmt "$total")** |"
          } > phases.md
          cat phases.md
          cat phases.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            UIResults.xcresult
            raw-ui-build.log
            raw-ui.log
          retention-days: 7
          if-no-files-found: warn
