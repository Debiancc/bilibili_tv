name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: SwiftLint & swift-format
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run lint & format check
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/check-lint-format.sh

  unit-tests:
    name: Unit + snapshot tests (bilibili_tvTests)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # xcbuild 的增量签名包含源文件 mtime,而 actions/checkout 每次全量重写 mtime →
      # 内容未变的文件也被判过期(本地实证:同内容 touch 全部源文件 → 144 个 swift 全部
      # 重编,与 CI 拆 key 后残留的 ~145 文件签名一致;DerivedData 内的包 checkout 因
      # mtime 未被触碰而保持增量)。按 git 历史还原 mtime:同一提交下恒定(签名命中),
      # 文件变更所在提交必然更新(mtime 前移,必然重编),无 stale 风险。
      - name: Restore source mtimes from git history
        run: |
          git ls-files -z '*.swift' | while IFS= read -r -d '' f; do
            ts=$(git log -1 --format=%ct -- "$f")
            touch -t "$(date -r "$ts" +%Y%m%d%H%M.%S)" "$f"
          done
      - name: Install xcresultparser
        run: brew install xcresultparser
      # SwiftPM 依赖缓存:小而稳定,key 只随 Package.resolved 变化
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/*.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      # 工具链指纹必须进 key:macos-latest 浮动镜像升级 Xcode 后,旧编译产物全部
      # 失效(2026-09 实证:8/10 创建的缓存 + 镜像升级 → 每次全量重编 ~2.5min,且
      # 精确命中永不回存,重建结果不落盘,死循环)。DerivedData 按 commit 轮换,
      # unit 与 UI 共享一个 key:两 job 现在都走同一 `build-for-testing` 形状,恢复
      # 对方的缓存即正确形状,互暖且配额减半。(#55 曾按 job 拆 key,当时 unit 是
      # `xcodebuild test` 形状、与 build-for-testing 互不兼容——本地实证同源码无改动
      # 106 行增量 vs 625 行全量。⚠️ 不变式:两 job 的构建命令必须逐字一致,一旦再
      # 出现形状分歧必须重新拆 key,否则每次 run 必恢复对方 shape → 每次全量重编。)
      # restore-keys 首行 dd-ui- 使过渡期首个 run 即命中 #55 期同形状缓存,其余为回退。
      - name: Resolve toolchain id
        run: echo "TOOLCHAIN_ID=$(xcodebuild -version | head -1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"
      - name: Cache DerivedData (rotates per commit)
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-${{ env.TOOLCHAIN_ID }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-dd-ui-${{ env.TOOLCHAIN_ID }}-
            ${{ runner.os }}-dd-${{ env.TOOLCHAIN_ID }}-
            ${{ runner.os }}-dd-unit-${{ env.TOOLCHAIN_ID }}-
      # No xcbeautify in the pipe: measured on GH runners it buffers ALL output
      # until process exit (0 bytes mid-run), leaving the live job log empty for
      # the whole build+test. Raw streaming output is greppable and live.
      #
      # Phase split mirroring the UI job (boot init → build → wait-for-boot →
      # test): unit tests are hosted tvOS-simulator tests (snapshot rendering),
      # so a boot always happens — starting it NON-BLOCKING hides its ~1m20s
      # wall under the CPU-bound build instead of serializing it into the test
      # phase. The build command must stay byte-identical to the UI job's (see
      # the DerivedData cache comment for the shape invariant).
      - name: Boot tvOS simulator (non-blocking)
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep "Apple TV 4K (3rd generation)" | grep -v "1080p" \
            | grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}' | head -1)
          echo "Booting Apple TV 4K (3rd generation): $UDID"
          echo "UNIT_BOOT_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "UNIT_SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build for testing
        run: |
          # Same pipefail rationale as the UI job: without it, `xcodebuild | tee`
          # returns tee's exit status — a failed build would pass the step, and
          # test-without-building would then run STALE products restored by the
          # DerivedData cache.
          set -o pipefail
          start=$(date +%s); rc=0
          # CI 不消费源码索引:关掉每文件的 index store,降低编译耗时。
          # -enableCodeCoverage YES 必须留在 build 侧:test-without-building 的
          # 覆盖率依赖 build-for-testing 生成的 xctestrun(test 步骤单独开无效,
          # 2026-09-03 CI 实证 xcresult 无 coverage)。flag 会改变 build shape,
          # 因此两个 job 的 build 步骤必须同步携带(见上方形状不变式)。
          xcodebuild build-for-testing \
            -project bilibili_tv.xcodeproj \
            -scheme bilibili_tv \
            -destination "platform=tvOS Simulator,name=Apple TV 4K (3rd generation)" \
            -enableCodeCoverage YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee raw-unit-build.log || rc=$?
          echo "UNIT_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit $rc
      - name: Wait for simulator ready
        run: |
          # Reap the async boot: near-instant when boot finished during the
          # build; UNIT_BOOT_SECONDS is only the residual wait (adds to wall),
          # UNIT_BOOT_WALL_SECONDS is the boot's own wall (hidden under build).
          start=$(date +%s)
          xcrun simctl bootstatus "$UNIT_SIM_UDID" -b
          echo "UNIT_BOOT_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "UNIT_BOOT_WALL_SECONDS=$(( $(date +%s) - UNIT_BOOT_START_EPOCH ))" >> "$GITHUB_ENV"
      - name: Run unit + snapshot tests
        run: |
          set -o pipefail
          start=$(date +%s); rc=0
          # Wall-clock bookmarks for the install-window query in the report
          # step (log show --start/--end use host-local time; CI hosts are UTC)
          echo "UNIT_RUN_START_TS=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          xcodebuild test-without-building \
            -project bilibili_tv.xcodeproj \
            -scheme bilibili_tv \
            -destination "id=$UNIT_SIM_UDID" \
            -only-testing:bilibili_tvTests \
            -enableCodeCoverage YES \
            -resultBundlePath UnitResults.xcresult 2>&1 | tee raw-unit.log || rc=$?
          echo "UNIT_RUN_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "UNIT_RUN_END_TS=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          exit $rc
      # Compact markdown (counts / failed tests / slowest tests) into the run
      # summary AND the job log; `::error` annotations on stderr surface failures
      # on the PR checks UI. Agents & humans get everything without downloading
      # the .xcresult artifact.
      - name: Test report & failure annotations
        if: always()
        run: |
          bash scripts/test-failure-report.sh UnitResults.xcresult "Unit + snapshot tests" > test-report.md
          cat test-report.md
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"
          bash scripts/test-phase-report.sh "Unit + snapshot tests" UNIT raw-unit.log > phases.md
          cat phases.md
          cat phases.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            UnitResults.xcresult
            raw-unit-build.log
            raw-unit.log
          retention-days: 7
          if-no-files-found: warn
      - name: Export coverage
        if: success()
        run: |
          xcresultparser \
            --output-format cobertura \
            --project-root "$GITHUB_WORKSPACE" \
            UnitResults.xcresult > coverage.xml
          echo "Exported coverage.xml ($(wc -l < coverage.xml) lines)"
      - name: Print coverage summary
        if: success()
        run: |
          line_rate=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | cut -d'"' -f2)
          lines_covered=$(grep -o 'lines-covered="[0-9]*"' coverage.xml | head -1 | cut -d'"' -f2)
          lines_valid=$(grep -o 'lines-valid="[0-9]*"' coverage.xml | head -1 | cut -d'"' -f2)
          printf "Line coverage: %.2f%% (%s/%s lines)\n" "$(echo "$line_rate * 100" | bc -l)" "$lines_covered" "$lines_valid"

  ui-tests:
    # Serial by design (AGENTS.md §12): the scheme's parallelizable flag clones
    # simulators and makes focus-timing tests slower AND flakier.
    # If PR-time runtime becomes a problem, move this job to a nightly `schedule`
    # trigger once issue #51 (launch merging etc.) lands.
    name: UI tests (bilibili_tvUITests, serial)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # xcbuild 的增量签名包含源文件 mtime,而 actions/checkout 每次全量重写 mtime →
      # 内容未变的文件也被判过期(本地实证:同内容 touch 全部源文件 → 144 个 swift 全部
      # 重编,与 CI 拆 key 后残留的 ~145 文件签名一致;DerivedData 内的包 checkout 因
      # mtime 未被触碰而保持增量)。按 git 历史还原 mtime:同一提交下恒定(签名命中),
      # 文件变更所在提交必然更新(mtime 前移,必然重编),无 stale 风险。
      - name: Restore source mtimes from git history
        run: |
          git ls-files -z '*.swift' | while IFS= read -r -d '' f; do
            ts=$(git log -1 --format=%ct -- "$f")
            touch -t "$(date -r "$ts" +%Y%m%d%H%M.%S)" "$f"
          done
      # SwiftPM 依赖缓存:小而稳定,key 只随 Package.resolved 变化
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/*.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      # 工具链指纹必须进 key:macos-latest 浮动镜像升级 Xcode 后,旧编译产物全部
      # 失效(2026-09 实证:8/10 创建的缓存 + 镜像升级 → 每次全量重编 ~2.5min,且
      # 精确命中永不回存,重建结果不落盘,死循环)。DerivedData 按 commit 轮换,
      # unit 与 UI 共享一个 key:两 job 都走同一 `build-for-testing` 形状,恢复对方
      # 的缓存即正确形状,互暖且配额减半。⚠️ 不变式:两 job 的构建命令(含
      # destination)必须逐字一致,一旦再出现形状分歧必须重新拆 key(#55 教训),
      # 否则每次 run 必恢复对方 shape → 每次全量重编。restore-keys 首行 dd-ui-
      # 使过渡期首个 run 即命中 #55 期同形状缓存,其余为回退。
      - name: Resolve toolchain id
        run: echo "TOOLCHAIN_ID=$(xcodebuild -version | head -1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"
      - name: Cache DerivedData (rotates per commit)
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-${{ env.TOOLCHAIN_ID }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-dd-ui-${{ env.TOOLCHAIN_ID }}-
            ${{ runner.os }}-dd-${{ env.TOOLCHAIN_ID }}-
            ${{ runner.os }}-dd-unit-${{ env.TOOLCHAIN_ID }}-
      # Phase split (boot init → build → wait-for-boot → test). Boot is
      # initiated NON-BLOCKING before the build: `simctl boot` returns as soon
      # as CoreSimulator accepts the request and the boot itself proceeds
      # asynchronously in the CoreSimulator service, so it overlaps the CPU-
      # bound build instead of serializing after it (both phases ~1m20s each,
      # saving ~1m of job wall). The boot is only reaped after the build with
      # `bootstatus -b` (fast no-op when boot already finished mid-build), and
      # the booted simulator is reused by UDID so the boot phase is not
      # double-counted inside xcodebuild. No xcbeautify in the pipe (see
      # unit-tests job note).
      - name: Boot tvOS simulator (non-blocking)
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep "Apple TV 4K (3rd generation)" | grep -v "1080p" \
            | grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}' | head -1)
          echo "Booting Apple TV 4K (3rd generation): $UDID"
          echo "UI_BOOT_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "UI_SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build for testing
        run: |
          # Runner's default shell is `bash -e` (NO pipefail): without this,
          # `xcodebuild | tee` returns tee's exit status, a failed build would
          # pass the step — and test-without-building would then run STALE
          # products restored by the DerivedData cache.
          set -o pipefail
          start=$(date +%s); rc=0
          # -enableCodeCoverage YES keeps this command byte-identical to the
          # unit job's build (shape invariant, see cache comment); UI tests
          # opt out of collection with -enableCodeCoverage NO at test time.
          # CI 不消费源码索引,关闭 index store 降低编译耗时
          xcodebuild build-for-testing \
            -project bilibili_tv.xcodeproj \
            -scheme bilibili_tv \
            -destination "platform=tvOS Simulator,name=Apple TV 4K (3rd generation)" \
            -enableCodeCoverage YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee raw-ui-build.log || rc=$?
          echo "UI_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit $rc
      - name: Wait for simulator ready
        run: |
          # Reap the async boot: near-instant when boot finished during the
          # build; UI_BOOT_SECONDS is only the residual wait (adds to wall),
          # UI_BOOT_WALL_SECONDS is the boot's own wall (hidden under build).
          start=$(date +%s)
          xcrun simctl bootstatus "$UI_SIM_UDID" -b
          echo "UI_BOOT_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "UI_BOOT_WALL_SECONDS=$(( $(date +%s) - UI_BOOT_START_EPOCH ))" >> "$GITHUB_ENV"
      - name: Run UI tests
        run: |
          set -o pipefail
          start=$(date +%s); rc=0
          # Wall-clock bookmarks for the install-window query in the report
          # step (log show --start/--end use host-local time; CI hosts are UTC)
          echo "UI_RUN_START_TS=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          xcodebuild test-without-building \
            -project bilibili_tv.xcodeproj \
            -scheme bilibili_tv \
            -destination "id=$UI_SIM_UDID" \
            -only-testing:bilibili_tvUITests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -resultBundlePath UIResults.xcresult 2>&1 | tee raw-ui.log || rc=$?
          echo "UI_RUN_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "UI_RUN_END_TS=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          exit $rc
      - name: Test report & failure annotations
        if: always()
        run: |
          bash scripts/test-failure-report.sh UIResults.xcresult "UI tests" > test-report.md
          cat test-report.md
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"

          # Phase duration table (shared with the unit job; steps record into
          # GITHUB_ENV and phases never reached degrade to 0 / n/a). Boot
          # overlaps the build, so the Total row (build + boot-wait + test)
          # stays the true job wall; the boot's own wall is shown as an
          # informational sub-row.
          bash scripts/test-phase-report.sh "UI tests" UI raw-ui.log > phases.md
          cat phases.md
          cat phases.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            UIResults.xcresult
            raw-ui-build.log
            raw-ui.log
          retention-days: 7
          if-no-files-found: warn
